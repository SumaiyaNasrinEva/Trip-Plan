<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Trip 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f3e7e8 0%, #e3d5e5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #5c3a42;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #7d6b70;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            background: #d8859e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(216, 133, 158, 0.3);
        }

        .btn:hover {
            background: #c5718a;
            transform: translateY(-2px);
        }

        .btn-no {
            background: #9b72cf;
            box-shadow: 0 4px 15px rgba(155, 114, 207, 0.3);
        }

        .btn-no:hover {
            background: #885ebd;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #5c3a42;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2d1d5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #faf6f7;
            color: #5c3a42;
        }

        select:focus, input:focus {
            border-color: #d8859e;
            background: #fff;
        }

        .info-box {
            background: #fbf0f2;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-box p {
            margin-bottom: 8px;
            color: #5c3a42;
            font-size: 14px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .emoji-header {
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji-header">👻 🧳 🚌 🌸</div>
        <h1>🌸 Are you ready for a trip with us? 🌸</h1>
        <p>Let's make some unforgettable memories together! 🥰</p>
        
        <div class="btn-container">
            <a href="plan.html" class="btn">YES! 💖</a>
            <button class="btn btn-no" onclick="alert('No option is not allowed! 😉')">NO 😭</button>
        </div>
    </div>

</body>
</html>
